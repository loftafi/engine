name: Engine automated tests

on:
  push: 
    branches: [master, experimental]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Build and Test Engine package
    steps:
      - uses: actions/checkout@v3
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: zig build test

